openapi: 3.0.3
info:
  title: VenueOS API
  version: 1.0.0
  description: Initial contract for the VenueOS backend. The user endpoints are the transitional template slice and will evolve through the documented implementation roadmap.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: Healthz
      summary: Check process liveness
      responses:
        "204":
          description: The process is alive.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
  /readyz:
    get:
      operationId: Readyz
      summary: Check dependency readiness
      responses:
        "204":
          description: The service can receive traffic.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/users:
    get:
      operationId: ListUsers
      summary: List users
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of users.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "400":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: CreateUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: User created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /v1/users/{id}:
    get:
      operationId: GetUser
      summary: Fetch a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested user.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
components:
  headers:
    RequestID:
      description: Opaque request correlation identifier.
      required: true
      schema:
        $ref: "#/components/schemas/RequestIdentifier"
  responses:
    Problem:
      description: A stable VenueOS API error response.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CreateUser:
      type: object
      additionalProperties: false
      required: [email, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 100
    User:
      type: object
      additionalProperties: false
      required: [id, email, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserList:
      type: object
      additionalProperties: false
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        limit:
          type: integer
        offset:
          type: integer
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      example:
        error:
          code: validation_failed
          message: The request is invalid.
          request_id: req_01JEXAMPLE
          details:
            - field: currency
              code: invalid
              message: Use a supported currency.
      properties:
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          maxLength: 64
        message:
          type: string
          maxLength: 500
        request_id:
          $ref: "#/components/schemas/RequestIdentifier"
        details:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        field:
          type: string
          maxLength: 128
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          maxLength: 64
        message:
          type: string
          maxLength: 500
    RequestIdentifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9._-]+$"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OIDC or VenueOS credential
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^(?:W/)?"?[1-9][0-9]*"?$'
    IfNoneMatch:
      in: header
      name: If-None-Match
      required: false
      schema:
        type: string

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: venueos
      POSTGRES_USER: venueos
      POSTGRES_PASSWORD: venueos
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venueos -d venueos"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

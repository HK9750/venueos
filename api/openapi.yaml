openapi: 3.0.3
info:
  title: VenueOS API
  version: 1.0.0
  description: Initial contract for the VenueOS backend. The user endpoints are the transitional template slice and will evolve through the documented implementation roadmap.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: Healthz
      summary: Check process liveness
      responses:
        "204":
          description: The process is alive.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
  /readyz:
    get:
      operationId: Readyz
      summary: Check dependency readiness
      responses:
        "204":
          description: The service can receive traffic.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/users:
    get:
      operationId: ListUsers
      summary: List users
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of users.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "400":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: CreateUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: User created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /v1/users/{id}:
    get:
      operationId: GetUser
      summary: Fetch a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested user.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /v1/organizations:
    post:
      operationId: CreateOrganization
      summary: Create an organization through the platform onboarding flow
      description: Requires an authenticated platform principal with platform.support permission.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganization"
      responses:
        "201":
          description: Organization created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "200":
          description: Previously created organization replayed for the same idempotency key and request.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /v1/organizations/{organization_id}:
    get:
      operationId: GetOrganization
      summary: Fetch an organization in the caller's verified tenant scope
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organization_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested organization.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /v1/organizations/{organization_id}/api-keys:
    get:
      operationId: ListAPIKeys
      summary: List organization API keys without secret material
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organization_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: cursor
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: A bounded page of API key metadata. Secret material is never returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: CreateAPIKey
      summary: Create a scoped organization API key
      description: Returns the high-entropy API key credential exactly once. Secret material is never returned by reads, rotation metadata, or revocation.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organization_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKey"
      responses:
        "201":
          description: API key created and secret issued once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedAPIKey"
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "415": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "500": {$ref: "#/components/responses/Problem"}
  /v1/organizations/{organization_id}/api-keys/{key_id}:
    delete:
      operationId: RevokeAPIKey
      summary: Revoke an organization API key
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organization_id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: key_id
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: The API key was revoked or was already revoked by this versioned command.
          headers:
            ETag:
              description: The current API key version.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /v1/organizations/{organization_id}/api-keys/{key_id}/rotate:
    post:
      operationId: RotateAPIKey
      summary: Rotate an organization API key
      description: Revokes the current key and returns a replacement secret exactly once. Rotation is an optimistic versioned command.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organization_id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: key_id
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateAPIKey"
      responses:
        "200":
          description: API key rotated and replacement secret issued once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedAPIKey"
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "415": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "500": {$ref: "#/components/responses/Problem"}
  /v1/organizations/{organization_id}/audit-entries:
    get:
      operationId: ListAuditEntries
      summary: Explore tenant audit entries
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organization_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: cursor
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - in: query
          name: actor_type
          schema:
            type: string
            maxLength: 32
        - in: query
          name: actor_id
          schema:
            type: string
            maxLength: 200
        - in: query
          name: action
          schema:
            type: string
            maxLength: 200
        - in: query
          name: subject_type
          schema:
            type: string
            maxLength: 64
        - in: query
          name: subject_id
          schema:
            type: string
            maxLength: 200
        - in: query
          name: result
          schema:
            type: string
            enum: [success, denied, failure]
        - in: query
          name: request_id
          schema:
            type: string
            maxLength: 128
        - in: query
          name: occurred_from
          schema:
            type: string
            format: date-time
        - in: query
          name: occurred_until
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: A bounded, tenant-scoped page of redacted audit entries.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /v1/organizations/{organization_id}/orders/{order_id}/refunds:
    post:
      operationId: CreateRefund
      summary: Request a refund for a confirmed order
      description: Creates the durable requested refund record and its audit/outbox entries. Provider execution is asynchronous; this endpoint never calls a payment provider while handling the request.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organization_id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: order_id
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateRefund"}
      responses:
        "201":
          description: Refund request recorded in requested state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Refund"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "415": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "500": {$ref: "#/components/responses/Problem"}
  /v1/organizations/{organization_id}/orders/{order_id}/refunds/{refund_id}:
    get:
      operationId: GetRefund
      summary: Get a refund request
      description: Returns the tenant-scoped durable refund state. Provider execution and reconciliation remain asynchronous.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organization_id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: order_id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: refund_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Durable refund request state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Refund"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "500": {$ref: "#/components/responses/Problem"}
  /v1/organizations/{organization_id}/devices:
    get:
      operationId: ListDevices
      summary: List enrolled scanner devices
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organization_id
          required: true
          schema: {type: string, format: uuid}
        - in: query
          name: limit
          schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 50}
        - in: query
          name: cursor
          schema: {type: string, minLength: 1, maxLength: 512}
      responses:
        "200":
          description: A bounded tenant-scoped device page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DevicePage"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "500": {$ref: "#/components/responses/Problem"}
    post:
      operationId: CreateDevice
      summary: Enroll a scanner device
      description: Returns the high-entropy device credential exactly once. The credential is never returned by reads or state changes.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organization_id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateDevice"}
      responses:
        "201":
          description: Device enrolled and credential issued once.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IssuedDevice"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "415": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "500": {$ref: "#/components/responses/Problem"}
  /v1/organizations/{organization_id}/devices/{device_id}:
    get:
      operationId: GetDevice
      summary: Get enrolled scanner device metadata
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organization_id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: device_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Device metadata without credential material.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "500": {$ref: "#/components/responses/Problem"}
  /v1/organizations/{organization_id}/devices/{device_id}/state:
    patch:
      operationId: ChangeDeviceState
      summary: Suspend, reactivate, or revoke a scanner device
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organization_id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: device_id
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangeDeviceState"}
      responses:
        "200":
          description: Updated device metadata.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "415": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "500": {$ref: "#/components/responses/Problem"}
  /v1/organizations/{organization_id}/devices/{device_id}/assignments:
    get:
      operationId: ListDeviceAssignments
      summary: List scoped device assignments
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organization_id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: device_id
          required: true
          schema: {type: string, format: uuid}
        - in: query
          name: limit
          schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 50}
        - in: query
          name: cursor
          schema: {type: string, minLength: 1, maxLength: 512}
      responses:
        "200":
          description: A bounded device-assignment page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeviceAssignmentPage"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "500": {$ref: "#/components/responses/Problem"}
    post:
      operationId: CreateDeviceAssignment
      summary: Assign a device to an entry session or gate
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organization_id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: device_id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateDeviceAssignment"}
      responses:
        "201":
          description: Device assignment created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeviceAssignment"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "415": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "500": {$ref: "#/components/responses/Problem"}
  /v1/organizations/{organization_id}/devices/{device_id}/assignments/{assignment_id}:
    delete:
      operationId: RevokeDeviceAssignment
      summary: Revoke a device assignment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organization_id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: device_id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: assignment_id
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Revoked assignment metadata.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeviceAssignment"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "500": {$ref: "#/components/responses/Problem"}
  /v1/organizations/{organization_id}/memberships:
    get:
      operationId: ListMemberships
      summary: List active and revoked memberships in the verified organization
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organization_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: cursor
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: A tenant-scoped membership page.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /v1/organizations/{organization_id}/invitations:
    post:
      operationId: CreateInvitation
      summary: Issue a one-time staff invitation token
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organization_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitation"
      responses:
        "201":
          description: Invitation issued; the token is returned exactly once.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /v1/organizations/{organization_id}/events:
    get:
      operationId: ListEvents
      summary: List tenant events
      security:
        - bearerAuth: []
      parameters:

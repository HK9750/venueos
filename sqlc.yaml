version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/user/postgres/query
    gen:
      go:
        package: sqlc
        out: internal/user/postgres/sqlc
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
  - engine: postgresql
    schema: migrations
    queries: internal/platform/postgres/query
    gen:
      go:
        package: sqlc
        out: internal/platform/postgres/sqlc
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
